<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Daily Manpower Report</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}
.app{max-width:560px;margin:auto}.header,.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
.header{background:#111827;color:#fff}.header h1{margin:0 0 5px;font-size:21px}.header p{margin:0;color:#d1d5db;font-size:13px}
h2{font-size:15px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#374151}
input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:82px;resize:vertical}
.total{display:flex;justify-content:space-between;background:#f3f4f6;border-radius:10px;padding:12px;font-weight:700}.total b{font-size:20px}
button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:8px;font-size:16px;font-weight:700}
.generate{background:#111827;color:#fff}.copy{background:#16a34a;color:#fff}.whatsapp{background:#25D366;color:#fff}.clear{background:#e5e7eb;color:#111827}
.preview{white-space:pre-wrap;background:#111827;color:#f9fafb;border-radius:12px;padding:15px;font:13px/1.55 monospace;overflow:auto}
.hint{font-size:12px;color:#6b7280;margin-top:8px}.count-box{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding:9px 12px;border-radius:9px;background:#f3f4f6;font-size:13px;color:#374151}.count-box b{font-size:16px;color:#111827}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>Daily Manpower Report</h1><p>TBM Project • Offline PWA</p></div>
<div class="card"><h2>Report Details</h2>
<div class="grid">
<div class="field"><label>Date</label><input id="date" type="date"></div>
<div class="field"><label>TBM</label><input id="tbm" value="01" inputmode="numeric"></div>
</div>
<div class="field"><label>Shift</label><input id="shift" value="06:30 - 18:30"></div>
</div>
<div class="card"><h2>Manpower</h2>
<div class="grid">
<div class="field"><label>Underground Hookers</label><input id="underground" type="number" min="0" value="2"></div>
<div class="field"><label>Onground Hookers</label><input id="onground" type="number" min="0" value="2"></div>
<div class="field"><label>Supervisor</label><input id="supervisor" type="number" min="0" value="1"></div>
<div class="field"><label>TBM Workers</label><input id="workers" type="number" min="0" value="32"></div>
</div>
<div class="total"><span>Total Manpower</span><b id="total">37</b></div>
</div>
<div class="card"><h2>Leave & Absent</h2>
<div class="field"><label>Leave — Employee Numbers</label><textarea id="leave" placeholder="287, 388, 491, 495"></textarea><div class="count-box"><span>Leave Count</span><b id="leaveCount">0</b></div></div>
<div class="field"><label>Absent — Employee Numbers</label><textarea id="absent" placeholder="594, 595, 633"></textarea><div class="count-box"><span>Absent Count</span><b id="absentCount">0</b></div></div>
</div>
<div class="card"><h2>Submitted By</h2>
<div class="field"><label>Supervisor Name</label><input id="submittedBy" value="B G D Madhusankha"></div>
<div class="field"><label>Designation</label><input id="designation" value="Supervisor"></div>
</div>
<div class="card">
<button class="generate" onclick="generateReport()">Generate Report</button>
<button class="copy" onclick="copyReport()">Copy Report</button>
<button class="whatsapp" onclick="shareWhatsApp()">Share to WhatsApp</button>
<button class="clear" onclick="clearForm()">Clear</button>
<div class="hint">Generate → Copy or Share to WhatsApp. Data is saved on this device.</div>
</div>
<div class="card"><h2>Preview</h2><div id="preview" class="preview">Your report will appear here.</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
function today(){let d=new Date(),o=d.getTimezoneOffset(),x=new Date(d.getTime()-o*60000);return x.toISOString().slice(0,10)}
function niceDate(v){return new Date(v+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"})}
function n(id){return Number($(id).value)||0}
function total(){let t=n("underground")+n("onground")+n("supervisor")+n("workers");$("total").textContent=t;return t}
function codes(v){return v.replace(/\n/g," ").split(/[,\s]+/).map(x=>x.trim()).filter(Boolean)}
function list(v){return codes(v).join(", ")}
function updateCounts(){
 $("leaveCount").textContent=codes($("leave").value).length;
 $("absentCount").textContent=codes($("absent").value).length;
}
function data(){return {date:$("date").value,tbm:$("tbm").value,shift:$("shift").value,underground:$("underground").value,onground:$("onground").value,supervisor:$("supervisor").value,workers:$("workers").value,leave:$("leave").value,absent:$("absent").value,submittedBy:$("submittedBy").value,designation:$("designation").value}}
function save(){localStorage.setItem("manpowerReportData",JSON.stringify(data()));total()}
function generateReport(){
 let t=total(),r=`DAILY MANPOWER REPORT

Date: ${niceDate($("date").value)}
TBM: ${$("tbm").value.trim()}
Shift: ${$("shift").value.trim()}

MANPOWER
────────────────────────
Underground Hookers : ${String(n("underground")).padStart(2,"0")}
Onground Hookers    : ${String(n("onground")).padStart(2,"0")}
Supervisor          : ${String(n("supervisor")).padStart(2,"0")}
TBM                 : ${String(n("workers")).padStart(2,"0")}
Total               : ${String(t).padStart(2,"0")}

LEAVE
────────────────────────
Count : ${String(codes($("leave").value).length).padStart(2,"0")}
Codes : ${list($("leave").value)||"None"}

ABSENT
────────────────────────
Count : ${String(codes($("absent").value).length).padStart(2,"0")}
Codes : ${list($("absent").value)||"None"}

Submitted by:
${$("submittedBy").value.trim()}
${$("designation").value.trim()}`;
$("preview").textContent=r;save()
}
async function copyReport(){
 generateReport();let text=$("preview").textContent;
 try{await navigator.clipboard.writeText(text)}catch(e){let ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
 alert("Report copied. Paste it into WhatsApp.")
}
function shareWhatsApp(){
 generateReport();
 const text=$("preview").textContent;
 const url="https://api.whatsapp.com/send?text="+encodeURIComponent(text);
 const win=window.open(url,"_blank");
 if(!win) window.location.href=url;
}
function load(){
 $("date").value=today();
 try{let s=JSON.parse(localStorage.getItem("manpowerReportData"));if(s)Object.keys(s).forEach(k=>{if($(k))$(k).value=s[k]})}catch(e){}
 if(!$("date").value)$("date").value=today();total()
}
["underground","onground","supervisor","workers"].forEach(id=>$(id).addEventListener("input",save));
["date","tbm","shift","submittedBy","designation"].forEach(id=>$(id).addEventListener("input",save));
["leave","absent"].forEach(id=>$(id).addEventListener("input",()=>{updateCounts();save()}));
load();
updateCounts();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))}
</script>
</body>
</html>
